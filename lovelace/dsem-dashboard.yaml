# DSEM — Deye Smart Energy Manager · Lovelace dashboard
#
# Import: Settings → Dashboards → Add dashboard → Webpage/empty →
# Edit → ⋮ → Raw configuration editor → paste this file (without the
# comment header).
#
# All cards use only core Lovelace types. The optional apexcharts-card
# view is in docs/DASHBOARD.md (requires the HACS frontend plugin).

title: DSEM
views:
  - title: Estado actual
    icon: mdi:home-lightning-bolt
    cards:
      - type: entities
        title: Estado del optimizador
        entities:
          - entity: >-
              sensor.deye_smart_energy_manager_estado_del_optimizador
            name: Estado
          - entity: >-
              sensor.deye_smart_energy_manager_estrategia_actual
            name: Estrategia
          - entity: select.deye_smart_energy_manager_modo
            name: Modo
          - entity: >-
              sensor.deye_smart_energy_manager_proxima_accion_del_plan
            name: Acción en curso / próxima

      - type: entities
        title: Control y objetivo SOC
        entities:
          - entity: select.deye_smart_energy_manager_modo
            name: Modo
          - entity: number.deye_smart_energy_manager_soc_objetivo
            name: SOC objetivo (%)
          - entity: time.deye_smart_energy_manager_hora_objetivo
            name: Hora objetivo
          - entity: >-
              switch.deye_sun_15k_sg05lp3_eu_sm2_battery_grid_charging
            name: Carga de red (físico)
        visibility:
          - condition: state
            entity: select.deye_smart_energy_manager_modo
            state_not: shadow

      - type: button
        name: Reoptimizar ahora
        icon: mdi:refresh
        tap_action:
          action: call-service
          service: deye_smart_energy_manager.reoptimize

      - type: horizontal-stack
        cards:
          - type: gauge
            entity: >-
              sensor.deye_smart_energy_manager_soc_de_bateria
            name: SOC batería
            min: 0
            max: 100
            severity:
              green: 35
              yellow: 20
              red: 0
          - type: entities
            title: Potencias ahora
            entities:
              - entity: >-
                  sensor.deye_smart_energy_manager_potencia_fv
                name: FV
              - entity: >-
                  sensor.deye_smart_energy_manager_potencia_de_red
                name: Red (+ importa / − exporta)
              - entity: >-
                  sensor.deye_smart_energy_manager_potencia_de_bateria
                name: Batería (+ descarga / − carga)

      - type: markdown
        title: Plan — resumen
        content: |
          {% set a =
            states.sensor.deye_smart_energy_manager_proxima_accion_del_plan.attributes
          %}
          {% set wtxt =
            ((a.warnings | default([])) | join(', ') if a.warnings else '—')
            | replace('soc_target_not_reached', 'objetivo SOC inalcanzable')
            | replace('soc_target_not_configured', 'objetivo SOC sin configurar')
            | replace('soc_target_out_of_horizon', 'objetivo fuera del horizonte')
            | replace('soc_target_above_soc_max', 'objetivo supera SOC máx')
            | replace('soc_unknown', 'SOC desconocido')
            | replace('no_price_data', 'sin datos de precio')
            | replace('price_gaps_filled', 'huecos de precio rellenados')
            | replace('battery_capacity_unknown', 'capacidad batería desconocida')
            | replace('invalid_soc_range', 'rango SOC inválido')
            | replace('reserve_below_min', 'reserva bajo el mínimo')
            | replace('soc_reserve_risk', 'reserva en riesgo')
          %}
          {% set ctxt =
            (a.control | default('—'))
            | replace('control_ok:on', 'correcto (permiso ON)')
            | replace('control_ok:off', 'correcto (permiso OFF)')
            | replace('control_written:on', 'escrito ON')
            | replace('control_written:off', 'escrito OFF')
            | replace('control_disabled_option', 'desactivado (opción)')
            | replace('control_backoff', 'en espera (backoff)')
            | replace('control_startup_grace', 'arranque')
            | replace('control_unsafe_data', 'datos no seguros')
            | replace('control_no_plan', 'sin plan')
            | replace('control_rate_limited', 'limitado por intervalo')
            | replace('control_write_failed_backoff', 'fallo escritura + espera')
            | replace('control_write_failed', 'fallo escritura')
            | replace('control_switch_unavailable', 'interruptor no disponible')
            | replace('control_error', 'error')
          %}
          {% set ls = a.load_source | default('') %}
          {% set ps = a.pv_source | default('') %}
          {% set ltxt =
            'perfil horario'
            ~ (' + nowcast' if 'nowcast' in ls else '')
            ~ (' + VE' if 'ev_live' in ls else '')
          %}
          {% set ptxt =
            'Forecast.Solar' if 'forecast_solar' in ps
            else ('estadísticas' if 'statistics' in ps else ps)
          %}
          {% set tou_txt =
            {'grid': 'red', 'both': 'FV + red', 'disabled': 'desactivada',
             'generator': 'generador', 'unknown': '—'}.get(a.tou_now | default('—'), a.tou_now | default('—'))
          %}
          {%- if a.plan_available %}
          | Métrica | Valor |
          |---|---|
          | Coste esperado | {{ '%.2f' % a.expected_cost_eur }} € |
          | Coste sin optimizar | {{ '%.2f' % a.baseline_cost_eur }} € |
          | **Ahorro estimado** | **{{ '%.2f' % a.expected_savings_eur }} €** |
          | Precios | {{ 'InfluxDB/REE' if a.price_source == 'influxdb' else 'PVPC' }} ({{ a.import_series | replace('electricity_price.precio_kwh[tipo=consumo]', 'consumo') }}) |
          | Vertido | {{ a.export_series | replace('electricity_price.precio_kwh[tipo=excedentes]', 'vertido') }} |
          | Carga prevista | {{ ltxt }} |
          | FV prevista | {{ ptxt }} |
          | Horas sin precio | {{ a.price_missing_hours }} |
          | Ventana TOU | {{ tou_txt }}{% if a.tou_now_soc is defined %} (SOC máx {{ a.tou_now_soc }}%){% endif %} |
          {%- if a.auto_floor_pct is defined %}
          | Suelo descarga autónoma | {{ a.auto_floor_pct }}% |
          {%- endif %}
          {%- if a.soc_target_pct is defined and a.soc_target_pct != 'unset' %}
          | Objetivo SOC | {{ a.soc_target_pct }}% a las {{ a.soc_target_time }} (hora {{ a.soc_target_slot }}) |
          {%- endif %}
          {%- if a.control is defined %}
          | Control | {{ ctxt }} |
          {%- endif %}
          | Avisos | {{ wtxt }} |
          {%- else -%}
          Plan no disponible (avisos: {{ wtxt }})
          {%- endif %}

      - type: history-graph
        title: Últimas 24 h
        hours_to_show: 24
        entities:
          - entity: >-
              sensor.deye_smart_energy_manager_potencia_fv
            name: FV
          - entity: >-
              sensor.deye_smart_energy_manager_potencia_de_red
            name: Red
          - entity: >-
              sensor.deye_smart_energy_manager_potencia_de_bateria
            name: Batería

  - title: Plan 24 h
    icon: mdi:calendar-clock
    cards:
      - type: markdown
        title: Slots del plan (acción prevista por hora)
        content: |
          {% set slots =
            state_attr('sensor.deye_smart_energy_manager_proxima_accion_del_plan',
            'slots') or [] %}
          {%- set amap = {
            'charge_pv': 'cargar FV', 'charge_grid': 'cargar red',
            'discharge': 'descargar', 'import': 'importar',
            'export': 'exportar', 'hold': 'retener', 'idle': 'reposo',
            'balanced': 'equilibrado'} %}
          {%- set rmap = {
            'pv_surplus': 'excedente FV',
            'pv_surplus_battery_full': 'excedente FV (batería llena)',
            'cheap_hour_precharge': 'hora barata: precarga',
            'soc_target_precharge': 'objetivo SOC: precarga',
            'soc_target_forced_charge': 'objetivo SOC: carga forzada',
            'soc_reserve_charge': 'reserva: carga forzada',
            'auto_discharge': 'descarga autónoma',
            'expensive_deficit': 'déficit en hora cara',
            'mid_price_import': 'importación precio medio',
            'reserve_hold': 'retención por reserva',
            'cheap_hour_no_headroom': 'hora barata sin margen',
            'balanced': 'equilibrado'} %}
          {%- if slots %}
          | Hora | Acción | Bat/Red W | SOC | €/kWh | Motivo |
          |---|---|---|---|---|---|
          {%- for s in slots %}
          | {{ s.t[8:10] }}/{{ s.t[5:7] }} {{ s.t[11:16] }} | {{ amap.get(s.action, s.action) }} | {{ '%+d/%+d' % (s.batt_w | round(0), s.grid_w | round(0)) }} | {{ s.soc_end | round(0) }}% | {{ s.eur_kwh | round(3) if s.eur_kwh is not none else '—' }} | {{ rmap.get(s.why, s.why) }} |
          {%- endfor %}

          *convención: bat W <0 carga / >0 descarga · red W >0 importa / <0 exporta*
          {%- else -%}
          Sin slots — el plan no está disponible.
          {%- endif %}
