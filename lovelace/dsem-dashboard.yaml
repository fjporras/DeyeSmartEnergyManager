# DSEM — Deye Smart Energy Manager · Lovelace dashboard
#
# Import: Settings → Dashboards → Add dashboard → Webpage/empty →
# Edit → ⋮ → Raw configuration editor → paste this file (without the
# comment header).
#
# All cards use only core Lovelace types. The optional apexcharts-card
# view is in docs/DASHBOARD.md (requires the HACS frontend plugin).

title: DSEM
views:
  - title: Estado actual
    icon: mdi:home-lightning-bolt
    cards:
      - type: entities
        title: Estado del optimizador
        entities:
          - entity: >-
              sensor.deye_smart_energy_manager_estado_del_optimizador
            name: Estado
          - entity: >-
              sensor.deye_smart_energy_manager_estrategia_actual
            name: Estrategia
          - entity: select.deye_smart_energy_manager_modo
            name: Modo
          - entity: >-
              sensor.deye_smart_energy_manager_proxima_accion_del_plan
            name: Acción en curso / próxima

      - type: entities
        title: Control y objetivo SOC
        entities:
          - entity: select.deye_smart_energy_manager_modo
            name: Modo
          - entity: number.deye_smart_energy_manager_soc_objetivo
            name: SOC objetivo (%)
          - entity: time.deye_smart_energy_manager_hora_objetivo
            name: Hora objetivo
          - entity: >-
              switch.deye_sun_15k_sg05lp3_eu_sm2_battery_grid_charging
            name: Carga de red (físico)
        visibility:
          - condition: state
            entity: select.deye_smart_energy_manager_modo
            state_not: shadow

      - type: button
        name: Reoptimizar ahora
        icon: mdi:refresh
        tap_action:
          action: call-service
          service: deye_smart_energy_manager.reoptimize

      - type: horizontal-stack
        cards:
          - type: gauge
            entity: >-
              sensor.deye_smart_energy_manager_soc_de_bateria
            name: SOC batería
            min: 0
            max: 100
            severity:
              green: 35
              yellow: 20
              red: 0
          - type: entities
            title: Potencias ahora
            entities:
              - entity: >-
                  sensor.deye_smart_energy_manager_potencia_fv
                name: FV
              - entity: >-
                  sensor.deye_smart_energy_manager_potencia_de_red
                name: Red (+ importa / − exporta)
              - entity: >-
                  sensor.deye_smart_energy_manager_potencia_de_bateria
                name: Batería (+ descarga / − carga)

      - type: markdown
        title: Plan — resumen
        content: |
          {% set a =
            states.sensor.deye_smart_energy_manager_proxima_accion_del_plan.attributes
          %}
          {%- if a.plan_available %}
          | Métrica | Valor |
          |---|---|
          | Coste esperado | {{ '%.2f' % a.expected_cost_eur }} € |
          | Coste baseline | {{ '%.2f' % a.baseline_cost_eur }} € |
          | **Ahorro estimado** | **{{ '%.2f' % a.expected_savings_eur }} €** |
          | Precios | {{ a.price_source }} ({{ a.import_series }}) |
          | Vertido | {{ a.export_series }} |
          | Carga | {{ a.load_source }} |
          | FV | {{ a.pv_source }} |
          | Horas sin precio | {{ a.price_missing_hours }} |
          {%- if a.soc_target_pct is defined and a.soc_target_pct != 'unset' %}
          | Objetivo SOC | {{ a.soc_target_pct }}% a las {{ a.soc_target_time }} (slot {{ a.soc_target_slot }}) |
          {%- endif %}
          {%- if a.control is defined %}
          | Control | {{ a.control }} |
          {%- endif %}
          | Warnings | {{ a.warnings | join(', ') if a.warnings else '—' }} |
          {%- else -%}
          Plan no disponible (warnings: {{ a.warnings | join(', ') if a.warnings else '—' }})
          {%- endif %}

      - type: history-graph
        title: Últimas 24 h
        hours_to_show: 24
        entities:
          - entity: >-
              sensor.deye_smart_energy_manager_potencia_fv
            name: FV
          - entity: >-
              sensor.deye_smart_energy_manager_potencia_de_red
            name: Red
          - entity: >-
              sensor.deye_smart_energy_manager_potencia_de_bateria
            name: Batería

  - title: Plan 24 h
    icon: mdi:calendar-clock
    cards:
      - type: markdown
        title: Slots del plan (acción prevista por hora)
        content: |
          {% set slots =
            state_attr('sensor.deye_smart_energy_manager_proxima_accion_del_plan',
            'slots') or [] %}
          {%- if slots %}
          | Día | Hora | Acción | Bat W | Red W | SOC | €/kWh | Motivo |
          |---|---|---|---|---|---|---|---|
          {%- for s in slots %}
          | {{ s.t[8:10] }}/{{ s.t[5:7] }} | {{ s.t[11:16] }} | {{ s.action }} | {{ s.batt_w | round(0) }} | {{ s.grid_w | round(0) }} | {{ s.soc_end | round(0) }}% | {{ s.eur_kwh if s.eur_kwh is not none else '—' }} | {{ s.why }} |
          {%- endfor %}

          *convención: bat W <0 carga / >0 descarga · red W >0 importa / <0 exporta*
          {%- else -%}
          Sin slots — el plan no está disponible.
          {%- endif %}
